name: CI

on:
  # Branches get CI through their pull request; pushing to main runs it once more.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-tests:
    name: Core unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S firmware/core -B firmware/core/build
      - name: Build
        run: cmake --build firmware/core/build
      - name: Test
        run: ctest --test-dir firmware/core/build --output-on-failure
      # protocol.yaml is the only definition; the generated files must match it.
      - name: Generated protocol bindings are up to date
        run: |
          pip install pyyaml
          python3 protocol/gen/gen.py --check

  fuzz:
    name: Protocol parser fuzzing (libFuzzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: firmware/core
        run: >
          clang -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all
          -Iinclude -Itests fuzz/fuzz_protocol.c src/*.c -o fuzz_protocol
      - name: Fuzz for 2 minutes
        working-directory: firmware/core
        run: |
          mkdir -p corpus
          ./fuzz_protocol -max_total_time=120 -max_len=1024 corpus
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crash-${{ github.sha }}
          path: firmware/core/crash-*

  host-lib:
    name: host-lib tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host-lib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: host-lib/package-lock.json
      - name: Build the host-built firmware for the round-trip tests
        working-directory: firmware/core
        run: cmake -S . -B build && cmake --build build --target kb_host_device
      - run: npm ci
      - run: npm test
        env:
          KB_HOST_DEVICE: ${{ github.workspace }}/firmware/core/build/kb_host_device

  app:
    name: Doghouse app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check -- --fail-on-warnings
      - run: npm test
      - run: npm run build

  desktop:
    name: Doghouse desktop app (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri's Linux dependencies
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" libwebkit2gtk-4.1-dev libudev-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # The app embeds the built web UI, so it has to exist first.
      - run: npm ci
      - run: npm run build
      - name: Format
        working-directory: app/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: app/src-tauri
        run: cargo test --locked

  firmware:
    name: Firmware (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: keyboard
            app: firmware
            board: dachshund60f/nrf52840
          # One build per supported panel on the J4 display header.
          - variant: keyboard + oled-ssd1306-128x32
            app: firmware
            board: dachshund60f/nrf52840
            display: oled-ssd1306-128x32
          - variant: keyboard + oled-ssd1306-128x64
            app: firmware
            board: dachshund60f/nrf52840
            display: oled-ssd1306-128x64
          - variant: keyboard + oled-sh1106-128x64
            app: firmware
            board: dachshund60f/nrf52840
            display: oled-sh1106-128x64
          - variant: keyboard + oled-sh1107-128x128
            app: firmware
            board: dachshund60f/nrf52840
            display: oled-sh1107-128x128
          - variant: keyboard + eink-2in13-v4
            app: firmware
            board: dachshund60f/nrf52840
            display: eink-2in13-v4
          - variant: keyboard + eink-2in13-v4-portrait
            app: firmware
            board: dachshund60f/nrf52840
            display: eink-2in13-v4-portrait
          - variant: dongle
            app: dongle
            board: nrf52840dongle/nrf52840
          # The Pup: the keyboard firmware on an nRF52840 Dongle (boards/Pup/).
          - variant: pup
            app: firmware
            board: nrf52840dongle/nrf52840
            artifact: pup
    env:
      # BOARD_ROOT makes Zephyr find boards/Dachshund60F/board.yml in this repo.
      EXTRA_ARGS: >-
        -DBOARD_ROOT=${{ github.workspace }}/kb
        ${{ matrix.display && format('-DEXTRA_DTC_OVERLAY_FILE=displays/{0}.overlay', matrix.display) || '' }}
      ARTIFACT: ${{ matrix.artifact || format('{0}{1}', matrix.app, matrix.display && format('-{0}', matrix.display) || '') }}
    steps:
      # West workspace: repo in ./kb, NCS projects alongside it.
      - uses: actions/checkout@v4
        with:
          path: kb
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: kb
          toolchains: arm-zephyr-eabi
      - name: Install NCS Python requirements
        run: pip install -r nrf/scripts/requirements-build.txt
      - name: Build (debug)
        run: >
          west build -p -b ${{ matrix.board }} -d build/${{ matrix.app }}-debug kb/${{ matrix.app }}
          -- $EXTRA_ARGS
      - name: Build (release)
        run: >
          west build -p -b ${{ matrix.board }} -d build/${{ matrix.app }}-release kb/${{ matrix.app }}
          -- $EXTRA_ARGS -DEXTRA_CONF_FILE=release.conf
      - name: Check the screen is built in
        if: matrix.display
        run: |
          for b in debug release; do
            grep -q '^CONFIG_KB_SCREEN=y' build/firmware-$b/firmware/zephyr/.config
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}-${{ github.sha }}
          path: |
            build/${{ matrix.app }}-*/merged.hex
            build/${{ matrix.app }}-*/${{ matrix.app }}/zephyr/zephyr.hex
            build/${{ matrix.app }}-*/${{ matrix.app }}/zephyr/zephyr.uf2
          if-no-files-found: warn

  bootloader:
    name: UF2 bootloader (Dachshund60F)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build
          pip install intelhex
      - name: Build
        run: boards/Dachshund60F/bootloader/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bootloader-${{ github.sha }}
          path: |
            build/bootloader/Adafruit_nRF52_Bootloader/_build/dachshund60f/dachshund60f_bootloader_s140_6.1.1.hex
            build/bootloader/Adafruit_nRF52_Bootloader/_build/dachshund60f/bootloader_mbr.uf2
            build/bootloader/Adafruit_nRF52_Bootloader/_build/dachshund60f/bootloader.hex
          if-no-files-found: error
