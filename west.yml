# West manifest for CI and for anyone who wants a self-contained workspace.
# Workspace layout (T2 topology): clone this repo into <workspace>/kb, then
#   cd <workspace> && west init -l kb && west update
# Keep <workspace> outside OneDrive / cloud-synced folders: NCS is several GB.
manifest:
  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect
  projects:
    - name: nrf
      repo-path: sdk-nrf
      remote: ncs
      revision: v3.4.1
      import: true
