# Base configuration for the keyboard firmware (debug builds).
# Release builds add release.conf: west build ... -- -DEXTRA_CONF_FILE=release.conf

CONFIG_GPIO=y
# QK_RBT in the keymap
CONFIG_REBOOT=y

# USB (device_next stack): boot keyboard with a per-board serial number
# taken from the chip's factory device ID.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_HWINFO=y
# Power management (phase 13): the battery gauge on the SAADC, and deep sleep.
CONFIG_ADC=y
CONFIG_POWEROFF=y

# Settings storage on storage_partition (src/storage.c).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# SK6812 indicator chain on SPIM3, powered through a load switch.
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_REGULATOR=y

# Bluetooth LE (src/kb_ble.c): HID over GATT, with one identity (its own
# address) and one bond per host profile, the battery and device
# information services, and the config protocol as vendor reports on the
# HID service. Pairing is Just Works: the board has no display.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Dachshund60F"
# 961: keyboard (HID subtype)
CONFIG_BT_DEVICE_APPEARANCE=961
CONFIG_BT_MAX_CONN=1
# Host profiles (BT_SEL(0)-BT_SEL(2)); host-lib's BLE_PROFILE_COUNT matches.
CONFIG_BT_ID_MAX=3
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_SMP=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
# Some laptops start two link-layer procedures at once and drop the link
# (Nordic's HID keyboard sample has the same workaround).
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_AUTO_PHY_UPDATE=n
# Ask for a 7.5-15 ms interval, skipping up to 30 events while idle.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
# 64-byte config reports need an ATT MTU of at least 67.
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_ATT_TX_COUNT=8

CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
# Inputs: keyboard, NKRO, consumer, system, mouse, config. Outputs: LEDs, config.
CONFIG_BT_HIDS_INPUT_REP_MAX=6
CONFIG_BT_HIDS_OUTPUT_REP_MAX=2
CONFIG_BT_HIDS_FEATURE_REP_MAX=0
CONFIG_BT_HIDS_ATTR_MAX=48
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_GATT_UUID16_POOL_SIZE=64
CONFIG_BT_GATT_CHRC_POOL_SIZE=24
CONFIG_BT_CONN_CTX=y

# Battery level comes with power management (phase 13).
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="Dachshund"
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="Dachshund60F"
# The USB IDs (Kconfig KB_USB_VID/PID), so the configurator finds the board
# over Bluetooth too. Vendor ID source 2: USB-IF.
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x1209
CONFIG_BT_DIS_PNP_PID=0x0001

# Bonds, identities, the host profile and the preferred output, in NVS on
# bt_settings_partition (CRC-checked and wear-levelled by NVS).
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y

# Debug logging over SEGGER RTT (SWD header); the board has no UART.
# Never log typed keystrokes, even here (see CLAUDE.md).
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_BT_HIDS_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
