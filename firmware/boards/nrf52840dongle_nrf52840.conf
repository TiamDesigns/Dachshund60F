# The Pup: the keyboard firmware on Nordic's nRF52840 Dongle (PCA10059).
# Zephyr adds this after prj.conf when building for nrf52840dongle/nrf52840;
# the pins are in boards/Pup/ (firmware/board.overlay).

# The board would otherwise put a CDC ACM console on USB.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
# The partitions in boards/Pup/firmware/board.overlay, after Nordic's MBR.
CONFIG_USE_DT_CODE_PARTITION=y

# Same USB IDs as the Dachshund60F, so Doghouse finds it; KB_MODEL loads
# boards/Pup/keyboard.json. A USB stick on a port, so no charger to feed.
CONFIG_KB_MODEL="Pup"
CONFIG_KB_USB_PRODUCT="Dachshund Pup"
CONFIG_KB_USB_MAX_POWER_MA=100
CONFIG_BT_DEVICE_NAME="Dachshund Pup"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Pup"

# The recovery key is the only key, so it takes a long hold, and it enters
# Nordic's bootloader (the same as pressing the reset button sideways).
CONFIG_KB_BOOTLOADER_GPREGRET=0xB1
CONFIG_KB_BOOTLOADER_HOLD_MS=10000
