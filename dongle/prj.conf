# Base configuration for the dongle firmware (debug builds).
# Release builds add release.conf: west build ... -- -DEXTRA_CONF_FILE=release.conf

CONFIG_GPIO=y
CONFIG_HWINFO=y

# USB (device_next stack): the same three HID interfaces as the keyboard
# (firmware/src/kb_usb.c, firmware/app.overlay), with the dongle's IDs.
# The nRF52840 Dongle board would otherwise put a CDC ACM console on USB.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y

# Enhanced ShockBurst receiver (PRX), on its own: no Bluetooth here, so no
# timeslots. Payloads up to 72 bytes carry a config frame; the keyboard's
# prj.conf must match.
CONFIG_ESB=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=72
CONFIG_CLOCK_CONTROL=y
CONFIG_ESB_CLOCK_INIT=y
# The Dachshund60F-Dongle PCB has no 32.768 kHz crystal (board.json).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Debug logging over SEGGER RTT (needs SWD). Never log typed keystrokes.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
