# Dachshund config protocol: the only definition of its commands.
#
# Generated from this file (never edit them by hand; run protocol/gen/gen.py):
#   firmware/core/include/kb/protocol_gen.h, firmware/core/src/protocol_gen.c
#   host-lib/src/protocol.gen.ts
#
# Rules (CLAUDE.md): bump `version` on any breaking change (removing or
# renumbering a command, changing a field); adding a command is not
# breaking. Ask before changing the frame format.

version: 1

# Vendor-defined HID interface, separate from the keyboard interfaces, so
# the OS never claims it and opening it needs no special permission.
hid:
  usage_page: 0xFF00
  usage: 0x44 # 'D'
  report_size: 64 # input and output reports, no report ID
  # Over Bluetooth the config reports share the HID service with the
  # keyboard's, so they carry this report ID (the frame is the same).
  ble_report_id: 6

# Every report is one frame, padded with zeros to report_size.
#
# Request (host to device):
#   0 command   1 sequence   2 payload length   3 protocol version   4.. payload
# Response (device to host):
#   0 command   1 sequence   2 payload length   3 status             4.. payload
#
# The device echoes command and sequence, so the host can match responses.
# It refuses every command except handshake with version_mismatch when
# byte 3 of the request isn't its own protocol version, so an old app can
# never write to a newer board. Payloads are little-endian.
#
# No CRC: USB, BLE and the 2.4 GHz link (ESB) already check every packet.
frame:
  header_size: 4
  max_payload: 60

# Status codes. Error responses carry no payload.
errors:
  - {name: ok, code: 0, doc: Success}
  - {name: unknown_command, code: 1, doc: The command ID isn't known to this firmware}
  - {name: bad_length, code: 2, doc: The payload length is wrong for this command}
  - {name: out_of_range, code: 3, doc: "An index (layer, row, column, offset) is out of range"}
  - {name: bad_value, code: 4, doc: "A value is invalid, such as an undefined keycode"}
  - {name: busy, code: 5, doc: The device can't do this now; try again}
  - {name: storage_full, code: 6, doc: Settings storage is full}
  - {name: storage_error, code: 7, doc: Settings storage failed}
  - {name: version_mismatch, code: 8, doc: The request's protocol version isn't the device's}
  - {name: not_supported, code: 9, doc: This build doesn't support the command}
  - {name: unreachable, code: 10, doc: "The dongle can't reach its keyboard (asleep, off or out of range); only a dongle answers this"}

# Capability bits in the handshake: which features this firmware has.
capabilities:
  - {name: keymap, bit: 0, doc: get/set keys and bulk keymap}
  - {name: persistence, bit: 1, doc: "save, revert and factory reset survive a power cycle"}
  - {name: encoders, bit: 2, doc: encoder mapping}
  - {name: macros, bit: 3, doc: macro buffer}
  - {name: advanced_keys, bit: 4, doc: "tap-hold settings, combos, tap dance, key overrides"}
  - {name: indicators, bit: 5, doc: indicator colours}
  - {name: settings, bit: 6, doc: global settings}
  - {name: matrix_stream, bit: 7, doc: live matrix state for the key tester}
  - {name: battery, bit: 8, doc: "battery level and power source (get_power)"}
  - {name: identify, bit: 9, doc: identify command}
  - {name: bluetooth, bit: 10, doc: "Bluetooth host profiles and output selection (get_connection and friends)"}
  - {name: timing, bit: 11, doc: "input timing counters (get_timing)"}
  - {name: dongle, bit: 12, doc: "the 2.4 GHz dongle output (get_dongle, pair_dongle, set_output 3)"}

# Advanced-key tables (kb/features.h), read and written one entry at a time
# with get_feature and set_feature. Each entry is `size` bytes in the layout
# given (u16 little-endian); `entries` is how many a table has. A position
# (row, col) of 0xFF, 0xFF is an unused slot; an entry whose result is 0
# (KC_NO) is unused. New fields are only ever appended, and a firmware that
# gets an entry shorter than its own keeps the defaults for the rest.
feature_tables:
  - name: options
    id: 0
    size: 14
    entries: 1
    doc: "leader_timeout_ms u16, caps_word_on_both_shifts u8, caps_word_idle_ms u16, auto_shift u8, auto_shift_ms u16, mouse_interval_ms u8, mouse_move_delta u8, mouse_max_speed u8, mouse_time_to_max_ms u16, mouse_wheel_interval_ms u8"
  - name: combo
    id: 1
    size: 14
    entries: 16
    doc: "row u8 + col u8 for each of 4 keys, result u16, timeout_ms u16 (0 = 50), layers u16 (bit mask, 0 = all)"
  - name: tap_dance
    id: 2
    size: 10
    entries: 16
    doc: "tap1 u16, hold1 u16, tap2 u16, tap3 u16, term_ms u16 (0 = the tapping term); TD(n) uses entry n"
  - name: key_override
    id: 3
    size: 6
    entries: 16
    doc: "trigger_mods u8 (HID modifier bits), trigger_key u8 (HID usage), replacement u16, layers u16"
  - name: leader
    id: 4
    size: 6
    entries: 16
    doc: "4 keys u8 (HID usages, 0 ends the sequence), result u16"
  - name: tap_hold
    id: 5
    size: 7
    entries: 16
    doc: "row u8, col u8, flags u8 (1 permissive hold, 2 hold on other key press, 4 retro tap), tapping_term_ms u16, quick_tap_ms u16"
  - name: encoder
    id: 6
    size: 4
    entries: 32
    doc: "clockwise u16, counter-clockwise u16; entry layer * 2 + encoder, only for layers the keymap has; KC_TRNS falls through"

# Field types: u8, u16, u32; char[N] (fixed, NUL-padded text); u8[] and
# u16[] (a variable-length array, only as the last field, its length taken
# from the payload length, with `max` elements at most).
#
# The keymap index used by the chunk commands runs layer by layer, then row
# by row, then column: index = (layer * rows + row) * cols + col.
commands:
  - name: handshake
    id: 0x01
    doc: Identify the board and its protocol. Always answered, whatever the request's version.
    request: []
    response:
      - {name: protocol_version, type: u8}
      - {name: firmware_major, type: u8}
      - {name: firmware_minor, type: u8}
      - {name: firmware_patch, type: u8}
      - {name: build, type: "char[16]", doc: git describe of the firmware build}
      - {name: capabilities, type: u32}
      - {name: rows, type: u8}
      - {name: cols, type: u8}
      - {name: layers, type: u8}
      - {name: encoders, type: u8}
      - {name: macro_buffer_size, type: u16}
      - {name: model, type: "char[16]", doc: "keyboard definition name, boards/<model>/"}

  - name: reboot
    id: 0x02
    doc: Reboot after the response is sent. The board drops off the bus.
    request:
      - {name: mode, type: u8, doc: "0 normal, 1 into the UF2 bootloader"}
    response: []

  - name: identify
    id: 0x03
    doc: Flash the indicator LEDs so the user can tell which board this is.
    request:
      - {name: seconds, type: u8, doc: 1-30}
    response: []

  - name: get_serial
    id: 0x04
    doc: The board's serial number, the same as the USB serial string. WebHID can't read USB strings, so the app asks here.
    request: []
    response:
      - {name: serial, type: "char[32]"}

  - name: get_key
    id: 0x10
    request:
      - {name: layer, type: u8}
      - {name: row, type: u8}
      - {name: col, type: u8}
    response:
      - {name: keycode, type: u16}

  - name: set_key
    id: 0x11
    doc: Change one key in the live keymap (RAM). save makes it permanent.
    request:
      - {name: layer, type: u8}
      - {name: row, type: u8}
      - {name: col, type: u8}
      - {name: keycode, type: u16}
    response: []

  - name: get_keymap_chunk
    id: 0x12
    doc: Read up to 28 keycodes from the live keymap, from a keymap index.
    request:
      - {name: offset, type: u16}
      - {name: count, type: u8}
    response:
      - {name: offset, type: u16}
      - {name: keycodes, type: "u16[]", max: 28}

  - name: set_keymap_chunk
    id: 0x13
    doc: Write up to 28 keycodes from a keymap index. Every keycode is checked first; on an error nothing changes.
    request:
      - {name: offset, type: u16}
      - {name: keycodes, type: "u16[]", max: 28}
    response: []

  - name: save
    id: 0x20
    doc: Write the live keymap and settings to flash.
    request: []
    response: []

  - name: revert
    id: 0x21
    doc: Replace the live keymap and settings with the saved ones.
    request: []
    response: []

  - name: factory_reset
    id: 0x22
    doc: Restore the compiled-in defaults, live and saved.
    request: []
    response: []

  - name: get_feature
    id: 0x30
    doc: Read one entry of an advanced-key table (see feature_tables).
    request:
      - {name: table, type: u8}
      - {name: index, type: u16}
    response:
      - {name: table, type: u8}
      - {name: index, type: u16}
      - {name: data, type: "u8[]", max: 56}

  - name: set_feature
    id: 0x31
    doc: Replace one entry of an advanced-key table in the live settings. The whole set of tables is checked first; on an error nothing changes.
    request:
      - {name: table, type: u8}
      - {name: index, type: u16}
      - {name: data, type: "u8[]", max: 56}
    response: []

  - name: get_macro_chunk
    id: 0x32
    doc: Read up to 56 bytes of the macro buffer being edited (the live one unless set_macro_chunk changed it since).
    request:
      - {name: offset, type: u16}
      - {name: count, type: u8}
    response:
      - {name: offset, type: u16}
      - {name: data, type: "u8[]", max: 56}

  - name: set_macro_chunk
    id: 0x33
    doc: Write up to 56 bytes into the macro buffer being edited. Nothing changes on the keyboard until apply_macros.
    request:
      - {name: offset, type: u16}
      - {name: data, type: "u8[]", max: 56}
    response: []

  - name: apply_macros
    id: 0x34
    doc: Check the edited macro buffer and make it the live one. bad_value if a step is malformed; the live macros stay and the edit is dropped.
    request: []
    response: []

  - name: get_settings
    id: 0x40
    doc: Read the live global settings.
    request: []
    response: &settings
      - {name: debounce_algorithm, type: u8, doc: "0 defer global, 1 defer per key, 2 eager global, 3 eager per key, 4 eager on press"}
      - {name: debounce_ms, type: u8, doc: 0-100}
      - {name: tapping_term_ms, type: u16, doc: 50-2000}
      - {name: nkro, type: u8, doc: "0 6KRO, 1 NKRO (the boot protocol always gets 6KRO)"}
      - {name: sleep_timeout_min, type: u8, doc: "0-240, 0 = never"}
      - {name: indicator_brightness, type: u8, doc: "0-100 %"}
      - {name: name, type: "char[16]", doc: "the owner's name for the board, UTF-8"}

  - name: set_settings
    id: 0x41
    doc: Replace the live global settings; they take effect at once, and save makes them permanent. Every field is checked first; on an error nothing changes.
    request: *settings
    response: []

  - name: get_indicators
    id: 0x42
    doc: "Read the indicator colours that don't depend on the layer. Colours are 0x00RRGGBB, before brightness; black is off."
    request: []
    response: &indicators
      - {name: caps, type: u32}
      - {name: num, type: u32}
      - {name: scroll, type: u32}
      - {name: battery, type: u32, doc: the battery gauge}
      - {name: battery_low, type: u32, doc: "the whole gauge, at or below battery_low_percent"}
      - {name: battery_low_percent, type: u8, doc: 0-100}

  - name: set_indicators
    id: 0x43
    doc: Replace the colours of get_indicators (live, like set_settings). bad_value if a colour's top byte isn't 0.
    request: *indicators
    response: []

  - name: get_layer_colour
    id: 0x44
    doc: The layer indicator's colour on one layer (0x00RRGGBB; black leaves it off).
    request:
      - {name: layer, type: u8}
    response:
      - {name: layer, type: u8}
      - {name: colour, type: u32}

  - name: set_layer_colour
    id: 0x45
    request:
      - {name: layer, type: u8}
      - {name: colour, type: u32}
    response: []

  - name: get_connection
    id: 0x50
    doc: "Where keys go now, and the Bluetooth host profiles. Outputs: 0 none, 1 USB, 2 Bluetooth, 3 the 2.4 GHz dongle."
    request: []
    response:
      - {name: active_output, type: u8, doc: "where keys go now (0 when no host is ready)"}
      - {name: preferred_output, type: u8, doc: "1-3: the output OUT_USB, OUT_BLE, OUT_2G4 or set_output picked; while it isn't ready, the first ready of USB, dongle and Bluetooth is used"}
      - {name: usb, type: u8, doc: "0 no host, 1 a host has configured the board"}
      - {name: ble, type: u8, doc: "0 off, 1 advertising, 2 connected, 3 connected and encrypted (keys flow)"}
      - {name: profile, type: u8, doc: the selected Bluetooth host profile}
      - {name: profile_count, type: u8}
      - {name: bonded, type: u8, doc: "bit n set: profile n is paired with a host"}

  - name: set_output
    id: 0x51
    doc: "Prefer this output (1 USB, 2 Bluetooth, 3 the 2.4 GHz dongle), as OUT_USB, OUT_BLE and OUT_2G4 do; kept across power cycles. bad_value for anything else, not_supported for an output this build lacks."
    request:
      - {name: output, type: u8}
    response: []

  - name: select_profile
    id: 0x52
    doc: "Switch Bluetooth to this host profile, as BT_SEL does: the current host is disconnected and the board advertises for that one."
    request:
      - {name: profile, type: u8}
    response: []

  - name: clear_profile
    id: 0x53
    doc: "Forget the host paired on this profile, as BT_CLR does for the selected one. If that host is the one asking over Bluetooth, the response is the last thing it gets."
    request:
      - {name: profile, type: u8}
    response: []

  - name: get_dongle
    id: 0x54
    doc: "The 2.4 GHz dongle link. Only the keyboard answers this; a dongle passes it on like any other command."
    request: []
    response:
      - {name: paired, type: u8, doc: "1: the keyboard knows a dongle"}
      - {name: link, type: u8, doc: "0 off (not paired, or the radio is asleep), 1 looking for the dongle, 2 in range, 3 in range and the dongle's host is ready (keys can flow)"}
      - {name: pairing, type: u8, doc: "1: looking for a dongle in pairing mode"}

  - name: pair_dongle
    id: 0x55
    doc: "Pair with a dongle, as RF_PAIR does: the keyboard looks for a dongle in pairing mode (press its button) for 30 s and keeps the first one it finds. Mode 0 stops looking, 1 starts, 2 forgets the paired dongle."
    request:
      - {name: mode, type: u8}
    response: []

  - name: get_power
    id: 0x60
    doc: "The battery and the power source. The cell is read only while it powers the board: on USB the power path feeds the board from VBUS, so the last reading stands (100 once the charger is done)."
    request: []
    response:
      - {name: battery_percent, type: u8, doc: "0-100, 255 while unknown (no reading on battery yet)"}
      - {name: battery_mv, type: u16, doc: "the cell at the last reading on battery, in mV; 0 while unknown"}
      - {name: charging, type: u8, doc: "1 while the charger is charging the cell"}
      - {name: usb_power, type: u8, doc: "1 while USB powers the board (it never sleeps then)"}

  - name: get_timing
    id: 0x61
    doc: "Input timing since power-up or the last reset, for measuring input delay. Times are in microseconds."
    request:
      - {name: reset, type: u8, doc: "1: zero the counters after reading them"}
    response:
      - {name: scan_period_us, type: u16, doc: the matrix scan period while keys are in use}
      - {name: scan_avg_us, type: u16, doc: time to read the whole matrix}
      - {name: scan_max_us, type: u16}
      - {name: report_avg_us, type: u16, doc: "from the start of the scan that saw a key change to its reports handed to the output"}
      - {name: report_max_us, type: u16}
      - {name: key_wakes, type: u32, doc: "scans started at once by a key press, while the scan waited for one, instead of by the timer"}
      - {name: scans, type: u32, doc: every scan}
